name: Build .mcpack

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Package behavior pack
        run: |
          cd BedrockAdvancementsBP
          zip -r ../BedrockAdvancementsBP.mcpack .

      - name: Upload mcpack artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedrockAdvancementsBP
          path: BedrockAdvancementsBP.mcpack
          retention-days: 90

  publish-release:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mcpack artifact
        uses: actions/download-artifact@v4
        with:
          name: BedrockAdvancementsBP
          path: dist

      - name: Publish or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="latest-mcpack"
          title="BedrockAdvancementsBP latest"
          notes="Download \`BedrockAdvancementsBP.mcpack\` and open it in Minecraft Bedrock Edition."
          asset="dist/BedrockAdvancementsBP.mcpack"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --repo "${{ github.repository }}" --clobber
            gh release edit "$tag" \
              --repo "${{ github.repository }}" \
              --latest \
              --title "$title" \
              --notes "$notes"
          else
            gh release create "$tag" "$asset" \
              --repo "${{ github.repository }}" \
              --latest \
              --title "$title" \
              --notes "$notes"
          fi
