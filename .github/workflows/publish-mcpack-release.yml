name: Publish .mcpack release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package behavior pack
        run: |
          cd BedrockAdvancementsBP
          zip -r ../BedrockAdvancementsBP.mcpack .

      - name: Prepare release metadata
        id: release
        run: |
          tag="mcpack-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=BedrockAdvancementsBP $tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" BedrockAdvancementsBP.mcpack \
            --repo "${{ github.repository }}" \
            --latest \
            --title "${{ steps.release.outputs.title }}" \
            --notes "Download \`BedrockAdvancementsBP.mcpack\` and open it in Minecraft Bedrock Edition."
